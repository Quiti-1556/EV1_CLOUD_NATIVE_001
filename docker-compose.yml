services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solicitudes
      POSTGRES_USER: solicitudes_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solicitudes_dev_only}
    volumes:
      - solicitudes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solicitudes_app -d solicitudes"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/solicitudes
      DB_USER: solicitudes_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-solicitudes_dev_only}
      APP_SECURITY_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:8080"]
    depends_on: [backend]
    read_only: true
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=16m", "/var/run:rw,noexec,nosuid,size=4m", "/tmp:rw,noexec,nosuid,size=8m"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  solicitudes_pgdata:
