name: Terraform y scripts
on:
  pull_request:
    paths: ['terraform/**', 'scripts/**', 'session-ms/**', 'user-token-ms/**', '.github/**']
  push:
    branches: [main]
    paths: ['terraform/**', 'scripts/**', 'session-ms/**', 'user-token-ms/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Política de tokens y Gateway
        run: node scripts/test-policy.mjs
      - name: Preparar Lambda sesión antes de validar archive_file
        run: bash scripts/prepare-session.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/bootstrap init -input=false
      - run: terraform -chdir=terraform/bootstrap validate
      - name: Bash y ShellCheck
        run: |
          for script in scripts/*.sh sincronizar-github.sh; do bash -n "$script"; done
          shellcheck -S error scripts/*.sh sincronizar-github.sh
