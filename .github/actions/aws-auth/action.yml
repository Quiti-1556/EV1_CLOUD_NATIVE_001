name: AWS authentication
description: OIDC preferido; credenciales temporales para Learner Lab.
inputs:
  region:
    required: true
    description: AWS region
  role:
    required: false
    description: OIDC role ARN
  access-key:
    required: false
    description: Temporary access key
  secret-key:
    required: false
    description: Temporary secret key
  session-token:
    required: false
    description: Temporary session token
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      if: inputs.role != ''
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}
        role-session-name: solicitud-${{ github.run_id }}
    - uses: aws-actions/configure-aws-credentials@v4
      if: inputs.role == ''
      with:
        aws-access-key-id: ${{ inputs.access-key }}
        aws-secret-access-key: ${{ inputs.secret-key }}
        aws-session-token: ${{ inputs.session-token }}
        aws-region: ${{ inputs.region }}
