# ============================================================================
# SOLICITUDES - Configuracion principal
# No guardar secretos aqui. Produccion los inyecta como variables de entorno.
# ============================================================================
spring.application.name=solicitudes
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solicitudes}
spring.datasource.username=${DB_USER:solicitudes_app}
spring.datasource.password=${DB_PASSWORD:solicitudes_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USER:${DB_USER:solicitudes_app}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD:solicitudes_dev_only}}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Identidad ya autorizada por Gateway; producción no valida JWT.

# Defensa por capas
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=1MB
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=none
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.server.port=${MANAGEMENT_PORT:8080}

logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN


app.identity-mode=${APP_IDENTITY_MODE:gateway}
