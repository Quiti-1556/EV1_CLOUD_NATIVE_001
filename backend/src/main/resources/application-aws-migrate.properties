# Proceso efímero de migraciones; nunca atiende tráfico de usuarios.
spring.main.web-application-type=none
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
app.bootstrap.enabled=true
app.security.enabled=false
app.cors.backend-enabled=false
app.security.issuer-uri=${COGNITO_ISSUER_URI}
app.security.client-id=${COGNITO_CLIENT_ID}
app.bootstrap.password=${APP_DB_PASSWORD}
